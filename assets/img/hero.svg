    <radialGradient id="tom" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="#FF7A5C"/><stop offset="1" stop-color="#BE1E19"/></radialGradient>
    <radialGradient id="ora" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="#FFC15E"/><stop offset="1" stop-color="#E8730C"/></radialGradient>
    <radialGradient id="lem" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="#FFF08A"/><stop offset="1" stop-color="#E2B400"/></radialGradient>
